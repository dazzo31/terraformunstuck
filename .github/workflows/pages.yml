name: Deploy GitHub Pages
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks for this exact source
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.DEPLOY_SHA;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'checks.yml', head_sha: sha, event: 'push', status: 'success'
            });
            if (!data.workflow_runs.some(run => run.head_sha === sha && run.head_branch === 'main')) {
              throw new Error('A successful Checks run on main is required for the exact deployment SHA.');
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published page and JavaScript entrypoint
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          const root = new URL(process.env.PAGE_URL);
          if (!root.pathname.endsWith('/')) root.pathname += '/';
          for (const path of ['', 'assets/js/app.js', 'assets/js/views/guidance.js']) {
            let success = false;
            for (let attempt = 0; attempt < 8; attempt++) {
              const response = await fetch(new URL(path, root), { cache: 'no-store' });
              const body = await response.text();
              if (response.ok && (path || body.includes('0.2.0'))) { success = true; break; }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!success) throw new Error('Published asset is unavailable or stale: ' + path);
          }
          console.log('Published page and JavaScript assets verified.');
          JS
